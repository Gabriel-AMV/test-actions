name: Build iOS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment: dev, qa, uat, or production'
      export-method:
        required: false
        type: string
        default: 'app-store'
        description: 'Export method: app-store, ad-hoc, development'
      upload-artifact:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload the built artifact'
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_PROVISIONING_PROFILE_BASE64:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false

jobs:
  build:
    name: Build iOS (${{ inputs.environment }})
    runs-on: macos-latest
    environment: ${{ inputs.environment }}

    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.artifact-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Export all variables and secrets
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          # Export all variables and secrets as environment variables
          echo "$ALL_VARS" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV
          echo "$ALL_SECRETS" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Debug environment variables
        run: |
          echo "BUNDLE_ID: $BUNDLE_ID"
          echo "PACKAGE_NAME: $PACKAGE_NAME"
          echo "APP_NAME: $APP_NAME"

      - name: Extract version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Run Expo Prebuild
        env:
          NODE_ENV: production
          VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: |
          pod repo update
          pod install --repo-update

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

          # extract provisioning profile UUID and Name
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_NAME=$PP_NAME" >> $GITHUB_ENV

      - name: Build iOS IPA using Fastlane
        working-directory: ios
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION_NAME: ${{ steps.get-version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          # Build and archive
          fastlane run build_app \
            workspace:"FileTest.xcworkspace" \
            scheme:"FileTest" \
            configuration:"Release" \
            export_method:"${{ inputs.export-method }}" \
            output_directory:"export" \
            output_name:"FileTest.ipa" \
            export_team_id:"${{ vars.APPLE_TEAM_ID }}" \
            codesigning_identity:"Apple Distribution" \
            export_options:"{\"provisioningProfiles\":{\"${{ env.BUNDLE_ID }}\":\"${{ env.PROVISIONING_PROFILE_NAME }}\"}}" \
            xcargs:"CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=${{ vars.APPLE_TEAM_ID }} PROVISIONING_PROFILE=${{ env.PROVISIONING_PROFILE_UUID }}" \
            clean:true

      - name: Output build logs on failure
        if: failure()
        run: |
          echo "=== Build log ==="
          cat ~/Library/Logs/gym/FileTest-FileTest.log || echo "Log file not found"

      - name: Set artifact name
        if: inputs.upload-artifact
        id: set-artifact-name
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          ARTIFACT_NAME="ios-${{ inputs.environment }}-${VERSION}-${{ github.run_number }}"
          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $ARTIFACT_NAME"

      - name: Upload artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact-name }}
          path: ios/export/FileTest.ipa
          retention-days: 30

      - name: Clean up keychain and provisioning profile
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          rm ~/Library/MobileDevice/Provisioning\ Profiles/build_pp.mobileprovision

