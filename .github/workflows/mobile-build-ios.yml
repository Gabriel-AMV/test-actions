name: Build iOS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment: dev, qa, uat, or production'
      export-method:
        required: false
        type: string
        default: 'app-store'
        description: 'Export method: app-store, ad-hoc, development'
      upload-artifact:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload the built artifact'
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_PROVISIONING_PROFILE_BASE64:
        required: true
      APPLE_TEAM_ID:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false

jobs:
  build:
    name: Build iOS (${{ inputs.environment }})
    runs-on: macos-latest
    environment: ${{ inputs.environment }}

    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.artifact-name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Load environment variables
        run: |
          ENV_NAME="${{ inputs.environment == 'dev' && 'development' || inputs.environment }}"
          if [ -f ".env.$ENV_NAME" ]; then
            cat ".env.$ENV_NAME" >> $GITHUB_ENV
          fi

      - name: Run Expo Prebuild
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Import certificate using Fastlane
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

          fastlane run import_certificate \
            certificate_path:certificate.p12 \
            certificate_password:"${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            keychain_name:build.keychain \
            keychain_password:actions

          rm certificate.p12

      - name: Import provisioning profile using Fastlane
        run: |
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

          fastlane run install_provisioning_profile \
            path:profile.mobileprovision

          rm profile.mobileprovision

      - name: Build iOS IPA using Fastlane
        working-directory: ios
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VERSION_NAME: ${{ steps.get-version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          fastlane run build_app \
            scheme:"FileTest" \
            configuration:"Release" \
            export_method:"${{ inputs.export-method }}" \
            output_directory:"export" \
            output_name:"FileTest.ipa" \
            export_team_id:"${{ secrets.APPLE_TEAM_ID }}" \
            codesigning_identity:"iPhone Distribution" \
            clean:true

      - name: Set artifact name
        if: inputs.upload-artifact
        id: set-artifact-name
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          ARTIFACT_NAME="ios-${{ inputs.environment }}-${VERSION}-${{ github.run_number }}"
          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $ARTIFACT_NAME"

      - name: Upload artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact-name }}
          path: ios/export/FileTest.ipa
          retention-days: 30

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
