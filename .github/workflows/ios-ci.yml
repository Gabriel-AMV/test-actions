name: iOS CI/CD

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment: dev, qa, uat, or production'
      export-method:
        required: false
        type: string
        default: 'app-store'
        description: 'Export method: app-store, ad-hoc, development'
    secrets:
      APPLE_CERTIFICATE_BASE64:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_PROVISIONING_PROFILE_BASE64:
        required: true
      APPLE_TEAM_ID:
        required: true
      APP_STORE_CONNECT_API_KEY_ID:
        required: true
      APP_STORE_CONNECT_ISSUER_ID:
        required: true
      APP_STORE_CONNECT_API_KEY_CONTENT:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false

  push:
    branches:
      - develop  # dev environment
      - qa       # qa environment
      - uat      # uat environment

  create:
    tags:
      - 'v*.*.*'  # production environment

jobs:
  build-and-deploy:
    name: Build & Deploy iOS
    runs-on: macos-latest
    environment: ${{ inputs.environment || (github.ref == 'refs/heads/develop' && 'dev') || (github.ref == 'refs/heads/qa' && 'qa') || (github.ref == 'refs/heads/uat' && 'uat') || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Load environment variables
        run: |
          ENV_NAME="${{ inputs.environment || (github.ref == 'refs/heads/develop' && 'development') || (github.ref == 'refs/heads/qa' && 'qa') || (github.ref == 'refs/heads/uat' && 'uat') || 'production' }}"
          if [ -f ".env.$ENV_NAME" ]; then
            cat ".env.$ENV_NAME" >> $GITHUB_ENV
          fi

      - name: Run Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Import certificate using Fastlane
        run: |
          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

          fastlane run import_certificate \
            certificate_path:certificate.p12 \
            certificate_password:"${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            keychain_name:build.keychain \
            keychain_password:actions

          rm certificate.p12

      - name: Import provisioning profile using Fastlane
        run: |
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > profile.mobileprovision

          fastlane run install_provisioning_profile \
            path:profile.mobileprovision

          rm profile.mobileprovision

      - name: Build iOS IPA using Fastlane
        working-directory: ios
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          fastlane run build_app \
            scheme:"FileTest" \
            configuration:"Release" \
            export_method:"${{ inputs.export-method || 'app-store' }}" \
            output_directory:"export" \
            output_name:"FileTest.ipa" \
            export_team_id:"${{ secrets.APPLE_TEAM_ID }}" \
            codesigning_identity:"iPhone Distribution" \
            clean:true

      # Uncomment to enable TestFlight upload
      # - name: Upload to TestFlight using Fastlane
      #   run: |
      #     mkdir -p ~/.appstoreconnect/private_keys
      #     echo "${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

      #     fastlane pilot upload \
      #       --ipa ios/export/FileTest.ipa \
      #       --api_key_path ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8 \
      #       --skip_waiting_for_build_processing

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain build.keychain || true
          # rm -rf ~/.appstoreconnect/private_keys
