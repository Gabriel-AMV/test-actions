name: Build iOS (with Match)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment: dev, qa, uat, or production'
      export-method:
        required: false
        type: string
        default: 'app-store'
        description: 'Export method: app-store, ad-hoc, development'
      upload-artifact:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload the built artifact'
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}
    secrets:
      MATCH_GIT_URL:
        required: true
        description: 'Git URL for Match certificates repository'
      MATCH_PASSWORD:
        required: true
        description: 'Password to decrypt Match certificates'
      MATCH_GIT_BASIC_AUTHORIZATION:
        required: false
        description: 'Base64 encoded Git credentials (username:token)'
      APPLE_ID:
        required: false
        description: 'Apple ID email (optional)'
      SENTRY_AUTH_TOKEN:
        required: true

jobs:
  build:
    name: Build iOS (${{ inputs.environment }})
    runs-on: macos-latest
    environment: ${{ inputs.environment }}

    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.artifact-name }}

    defaults:
      run:
        working-directory: ./src/mobile/mobile-sop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export all environment variables
        env:
          VARS_CONTEXT: ${{ toJson(vars) }}
        run: |
          echo "$VARS_CONTEXT" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './src/mobile/mobile-sop/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Run Expo Prebuild
        env:
          NODE_ENV: production
          VERSION_CODE: ${{ github.run_number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx expo prebuild --platform ios --clean

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: './src/mobile/mobile-sop'

      - name: Install Fastlane and dependencies
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Install CocoaPods
        working-directory: ./src/mobile/mobile-sop/ios
        run: |
          pod repo update
          pod install --repo-update

      - name: Setup temporary keychain
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add keychain to search list
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychain -d user | sed s/\"//g)

          # Save for later steps
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Sync certificates with Match
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        run: |
          MATCH_TYPE="appstore"
          if [ "${{ inputs.export-method }}" == "ad-hoc" ]; then
            MATCH_TYPE="adhoc"
          elif [ "${{ inputs.export-method }}" == "development" ]; then
            MATCH_TYPE="development"
          fi

          bundle exec fastlane match $MATCH_TYPE \
            --readonly true \
            --git_url "$MATCH_GIT_URL" \
            --git_branch "main" \
            --git_basic_authorization "$MATCH_GIT_BASIC_AUTHORIZATION" \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$APPLE_TEAM_ID" \
            --keychain_name "$KEYCHAIN_PATH" \
            --keychain_password "$KEYCHAIN_PASSWORD"

      - name: Debug Code Signing
        run: |
          echo "=== Installed Certificates ==="
          security find-identity -v -p codesigning

          echo ""
          echo "=== Installed Provisioning Profiles ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

          echo ""
          echo "=== Provisioning Profile Details ==="
          for profile in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            echo "Profile: $profile"
            security cms -D -i "$profile" | plutil -p - | grep -E "Name|UUID|TeamIdentifier|ApplicationIdentifierPrefix"
            echo "---"
          done

          echo ""
          echo "=== Xcode Project Signing Settings ==="
          WORKSPACE_NAME=$(echo "${{ env.APP_NAME }}" | tr -d ' ')
          plutil -p "ios/${WORKSPACE_NAME}.xcodeproj/project.pbxproj" | grep -A 5 -B 5 "CODE_SIGN" || echo "No signing settings found in project"

      - name: Build iOS IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          APP_NAME: ${{ env.APP_NAME }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          WORKSPACE_NAME=$(echo "${{ env.APP_NAME }}" | tr -d ' ')

          # Extract provisioning profile UUID and Name
          PP_PATH=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -n 1)
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          PP_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< $(security cms -D -i $PP_PATH))

          echo "Using provisioning profile: $PP_NAME"
          echo "Profile UUID: $PP_UUID"

          bundle exec fastlane gym \
            --workspace "ios/${WORKSPACE_NAME}.xcworkspace" \
            --scheme "$WORKSPACE_NAME" \
            --configuration "Release" \
            --export_method "${{ inputs.export-method }}" \
            --output_directory "ios/export" \
            --output_name "${{ env.APP_NAME }}.ipa" \
            --export_team_id "$APPLE_TEAM_ID" \
            --codesigning_identity "Apple Distribution" \
            --export_options "{\"provisioningProfiles\":{\"$BUNDLE_ID\":\"$PP_NAME\"}}" \
            --xcargs "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$APPLE_TEAM_ID PROVISIONING_PROFILE=$PP_UUID" \
            --clean

      - name: Set artifact name
        if: inputs.upload-artifact
        id: set-artifact-name
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          ARTIFACT_NAME="ios-${{ inputs.environment }}-${VERSION}-${{ github.run_number }}"
          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $ARTIFACT_NAME"

      - name: Upload artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact-name }}
          path: src/mobile/mobile-sop/ios/export/${{ env.APP_NAME }}.ipa
          retention-days: 30
