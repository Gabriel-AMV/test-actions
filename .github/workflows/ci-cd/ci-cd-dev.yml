name: CI/CD - Development

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (Dev)
    uses: ./.github/workflows/builds/build-android.yml
    with:
      environment: dev
      upload-artifact: true
    secrets: inherit

  build-ios:
    name: Build iOS (Dev)
    uses: ./.github/workflows/builds/build-ios.yml
    with:
      environment: dev
      export-method: app-store
      upload-artifact: true
    secrets: inherit

