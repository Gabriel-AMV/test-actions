name: CI/CD - QA

on:
  push:
    branches:
      - qa
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android (QA)
    uses: ./.github/workflows/mobile-build-android.yml
    with:
      environment: qa
      upload-artifact: true
    secrets: inherit

  build-ios:
    name: Build iOS (QA)
    uses: ./.github/workflows/mobile-build-ios.yml
    with:
      environment: qa
      export-method: app-store
      upload-artifact: true
    secrets: inherit

