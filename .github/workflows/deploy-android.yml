name: Deploy Android to Play Store

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment: dev, qa, uat, or production'
      artifact-name:
        required: true
        type: string
        description: 'Name of the artifact to deploy'
      track:
        required: false
        type: string
        default: 'internal'
        description: 'Play Store track: internal, alpha, beta, production'
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: true

jobs:
  deploy:
    name: Deploy to Play Store (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./artifacts

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Fastlane
        run: gem install fastlane

      - name: Deploy to Play Store
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Create service account JSON file
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > service_account.json

          # Deploy using Fastlane
          fastlane supply \
            --aab ./artifacts/app-release.aab \
            --track ${{ inputs.track }} \
            --json_key service_account.json \
            --package_name ${{ vars.PACKAGE_NAME }} \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots

      - name: Cleanup
        if: always()
        run: rm -f service_account.json
