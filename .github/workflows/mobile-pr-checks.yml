name: PR Validation

run-name: "PR Validation - PR #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'src/mobile/mobile-sop/**'
              - '.github/workflows/mobile-*.yml'

  determine-environment:
    name: Determine Environment
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-determine-environment.yml

  validate-android:
    name: Validate Android
    needs: [changes, determine-environment]
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-build-android.yml
    with:
      environment: ${{ needs.determine-environment.outputs.environment }}
      upload-artifact: false  # Don't upload artifacts for PR validation
    secrets: inherit  # Pass all secrets from the determined environment

  validate-ios:
    name: Validate iOS
    needs: [changes, determine-environment]
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-build-ios-with-match.yml
    with:
      environment: ${{ needs.determine-environment.outputs.environment }}
      export-method: app-store
      upload-artifact: false  # Don't upload artifacts for PR validation
    secrets: inherit  # Pass all secrets from the determined environment

  mobile-pr-check:
    name: Mobile PR Check
    runs-on: ubuntu-latest
    needs: [changes, determine-environment, validate-android, validate-ios]
    if: always()
    steps:
      - name: Check if mobile validation succeeded
        if: |
          needs.changes.outputs.mobile == 'true' && (
            needs.validate-android.result == 'failure' ||
            needs.validate-ios.result == 'failure'
          )
        run: |
          echo "Mobile validation failed"
          exit 1
      - name: All checks passed
        run: echo "All required PR checks passed or were skipped"
