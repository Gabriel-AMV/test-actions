name: Build Android

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment: dev, qa, uat, or production'
      upload-artifact:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload the built artifact'
      build-type:
        required: false
        type: string
        default: 'aab'
        description: 'Build type: aab, apk, or both'
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      SENTRY_AUTH_TOKEN:
        required: false

env:
  APP_NAME: ${{ vars.APP_NAME }}
  BUNDLE_ID: ${{ vars.BUNDLE_ID }}
  PACKAGE_NAME: ${{ vars.PACKAGE_NAME }}

jobs:
  build:
    name: Build Android (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.artifact-name }}

    defaults:
      run:
        working-directory: ./src/mobile/mobile-sop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './src/mobile/mobile-sop/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Run Expo Prebuild
        env:
          NODE_ENV: production
          VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --clean

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build Android AAB with release signing
        if: inputs.build-type == 'aab' || inputs.build-type == 'both'
        working-directory: ./src/mobile/mobile-sop/android
        env:
          VERSION_NAME: ${{ steps.get-version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/src/mobile/mobile-sop/keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Build Android APK with release signing
        if: inputs.build-type == 'apk' || inputs.build-type == 'both'
        working-directory: ./src/mobile/mobile-sop/android
        env:
          VERSION_NAME: ${{ steps.get-version.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/src/mobile/mobile-sop/keystore.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Set artifact name
        if: inputs.upload-artifact
        id: set-artifact-name
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          BUILD_TYPE="${{ inputs.build-type }}"
          ARTIFACT_NAME="android-${BUILD_TYPE}-${{ inputs.environment }}-${VERSION}-${{ github.run_number }}"
          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $ARTIFACT_NAME"

      - name: Upload AAB artifact
        if: inputs.upload-artifact && (inputs.build-type == 'aab' || inputs.build-type == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact-name }}-aab
          path: src/mobile/mobile-sop/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload APK artifact
        if: inputs.upload-artifact && (inputs.build-type == 'apk' || inputs.build-type == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact-name }}-apk
          path: src/mobile/mobile-sop/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f keystore.jks
