name: Build Android

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: 'Environment: dev, qa, uat, or production'
      upload-artifact:
        required: false
        type: boolean
        default: true
        description: 'Whether to upload the built artifact'
    outputs:
      artifact-name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-name }}
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true

jobs:
  build:
    name: Build Android (${{ inputs.environment }})
    runs-on: ubuntu-latest-4-cores
    environment: ${{ inputs.environment }}

    outputs:
      artifact-name: ${{ steps.set-artifact-name.outputs.artifact-name }}

    defaults:
      run:
        working-directory: ./src/mobile/mobile-sop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Export all environment variables
        env:
          VARS_CONTEXT: ${{ toJson(vars) }}
        run: |
          echo "$VARS_CONTEXT" | jq -r 'to_entries | .[] | "\(.key)=\(.value)"' >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './src/mobile/mobile-sop/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Run Expo Prebuild
        env:
          NODE_ENV: production
          VERSION_CODE: ${{ github.run_number }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npx expo prebuild --platform android --clean

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: './src/mobile/mobile-sop'

      - name: Install Fastlane and dependencies
        run: |
          bundle config set --local path 'vendor/bundle'
          bundle install

      - name: Decode keystore
        id: setup-keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          echo "keystore-path=${{ github.workspace }}/src/mobile/mobile-sop/keystore.jks" >> $GITHUB_OUTPUT

      - name: Build Android APK with Fastlane
        env:
          KEYSTORE_PATH: ${{ steps.setup-keystore.outputs.keystore-path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_TYPE: apk
          VERSION_NAME: ${{ steps.get-version.outputs.version }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bundle exec fastlane android build

      - name: Set artifact name
        if: inputs.upload-artifact
        id: set-artifact-name
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          ARTIFACT_NAME="android-apk-${{ inputs.environment }}-${VERSION}-${{ github.run_number }}"
          echo "artifact-name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "Artifact name: $ARTIFACT_NAME"

      - name: Upload APK artifact
        if: inputs.upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact-name.outputs.artifact-name }}
          path: src/mobile/mobile-sop/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Cleanup
        if: always()
        run: rm -f keystore.jks
